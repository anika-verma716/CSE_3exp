<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Forms</title>
    </head>
    <body>
       <fieldset>
        <legend>biodata</legend>
        <form action="response.html" method="post">
            <label for="name">Name:</label>
            <input type="text" name="name" id="name"
            placeholder="Enter your name" required>
            <br><br>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email"
            placeholder="Enter your email" required>
            <br><br>
            <label for="password">Password:</label>
            <input type="password" name="password" id="password"
            placeholder="Enter your password" required>
            <br><br>
            <label for="gen">Gender:</label>
            <input type="radio" name="gen" id="gen"
            <label for="gen">Male</label>
            <input type="radio" name="gen" id="gen"
            <label for="gen">Female</label>
            <br><br>
            <label for="hobb">hobbies:</label>
            <input type="checkbox" name="check" id="crick"
            <label for="crick">Cricket</label>
            <input type="checkbox" name="check2" id="fashion"
            <label for="fashion">Fashion</label>
            <br><br>
            <select name="lang" id="lang">
                <option value="C">select one lang</option>
                <option value="C++">C++</option>
                <option value="Python">Python</option>
            </select>
            <label for="DOB">Date of Birth:</label>
            <input type="date" name="dob" id="dob">
            <label for="attempt">attempt:</label>
            <input type="number" name="attempt" id="attempt">
            <br><br>
            <label for="url" name="url">URL:</label>
            <input type="url" name="url" id="url">
            <br><br>
            <label for="file">upload your resume:</label>
            <input type="file" name="file" id="file">
            <br><br>
            <input type="submit">
            <input type="reset">


        </form>
        </fieldset>
        
    </body>
</html>
